<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentX Social</title>
</head>
<body>
<!-- Boot loading state: visible on the very first paint, BEFORE React mounts,
     so a logged-in owner on /#preview never sees the login form flash.
     React removes this node on first render. -->
<div id="boot-loading" class="boot-loading" role="status">
  <div class="spinner" aria-hidden="true"></div>
  <p id="boot-loading-text">Loading AgentX Social…</p>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
